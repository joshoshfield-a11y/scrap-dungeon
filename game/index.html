<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>SCRAP DUNGEON</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="wrap">
  <header>
    <div id="hud">
      <span>LEVEL: <span id="hud-depth">1</span></span>
      <span class="hud-sep">|</span>
      <span id="hud-turn">PLAYER TURN</span>
      <span class="hud-sep">|</span>
      <span><span class="hud-heart">♥</span> <span id="hud-hp">100 / 100</span><span class="hud-hp-bar"><span id="hud-hp-fill"></span></span></span>
      <span class="hud-sep">|</span>
      <span><span class="hud-gear">⚙</span> <span id="hud-carried">0</span></span>
      <span class="hud-sep">|</span>
      <span>Ammo <span class="hud-ammo-icon">▰</span> <span id="hud-ammo">12</span></span>
      <span class="hud-sep">|</span>
      <span>Banked <span id="hud-banked">0</span></span>
      <span id="hud-keys-wrap"><span class="hud-sep">|</span> Keys <span id="hud-keys">0</span></span>
      <span class="hud-sep">|</span>
      <span>Power <span id="hud-power">OK</span></span>
    </div>
    <!-- Phase 3: energy/heat meters + active mech effects. Collapses
         (empty, hidden) when energy is full, heat is 0, and no
         effect is active — the proposed default for open decision
         §14 #3, flagged in PHASE3-REPORT.md. -->
    <div id="hud-meters" class="hidden"></div>
  </header>
  <div id="main">
    <div id="canvas-wrap">
      <canvas id="game" width="960" height="640"></canvas>
      <div id="fx-overlay" aria-hidden="true"></div>
      <div id="transient-msg" aria-live="polite"></div>
      <div id="stairs-panel" class="hidden">
        <div id="stairs-info"></div>
        <button id="btn-stairs-descend">‹ BANK &amp; DESCEND ›</button>
        <button id="btn-stairs-extract">‹ EXTRACT (KEEP ALL) ›</button>
        <button id="btn-stairs-cancel">Cancel</button>
      </div>
    </div>
  </div>
  <div id="dock">
    <div id="quickbar" aria-label="Quickslots">
      <button id="btn-fire" class="qs-slot" aria-label="Fire weapon" title="Fire the equipped weapon along your facing (F)"><span class="qs-label">FIRE</span><span class="qs-count" id="qs-ammo-count">12</span></button>
      <button id="btn-force" class="qs-slot" aria-label="Force a locked door" title="Force the locked door you face (X)"><span class="qs-label">FORCE</span><span class="qs-count" id="qs-force-count">X</span></button>
      <button id="qs-health" class="qs-slot" aria-label="Use health cell" title="Use a health cell (+25 HP)"><span class="qs-label">+HP</span><span class="qs-count" id="qs-health-count">0</span></button>
      <button id="qs-food" class="qs-slot" aria-label="Use food" title="Eat food (restores 40 actions of power)"><span class="qs-label">FOOD</span><span class="qs-count" id="qs-food-count">0</span></button>
      <button id="qs-repair" class="qs-slot" aria-label="Use repair kit" title="Use a repair kit (+50 HP)"><span class="qs-label">KIT</span><span class="qs-count" id="qs-repair-count">0</span></button>
    </div>
    <div id="bottom-bar">
      <div id="action-bar">
        <button id="btn-wait" aria-label="Wait" title="Wait"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 2.5c2.6 0 4.2 1.9 4.2 4.4v2.6c0 1.8-.8 2.9-1.3 4.3l-.4 1.7c-.5 2.3-1.6 3.5-3 3.5S5.5 17.8 5 15.5l-.4-1.7C4.1 12.4 3.3 11.3 3.3 9.5V6.9c0-2.5 2.2-4.4 5.2-4.4z"/><circle cx="5.2" cy="4.2" r="1"/><circle cx="11.8" cy="4.6" r="1"/></svg></button>
        <button id="btn-wrench" aria-label="Use item" title="Use item"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M14.5 3.5a4.5 4.5 0 0 0-5.6 5.6L4 14l2 2 4.9-4.9A4.5 4.5 0 0 0 17 6.5l-2.5 2.5-2-2L14.5 3.5z"/></svg></button>
        <button id="btn-menu" aria-label="Menu" title="Menu"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5 5l2.1 2.1M16.9 16.9L19 19M19 5l-2.1 2.1M7.1 16.9L5 19"/></svg></button>
        <button id="btn-search" aria-label="Search" title="Search"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 11V5.5a1.5 1.5 0 0 1 3 0V10M11 10V4.5a1.5 1.5 0 0 1 3 0V10M14 10.5V6a1.5 1.5 0 0 1 3 0v6M17 11.5V8.5a1.5 1.5 0 0 1 3 0V14a6 6 0 0 1-6 6h-.8a5 5 0 0 1-3.5-1.5L6 14.5a1.8 1.8 0 0 1 2.5-2.5L8 12"/></svg></button>
        <button id="btn-inventory" aria-label="Bag" title="Bag"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9h14l-1 11H6L5 9z"/><path d="M9 9V7a3 3 0 0 1 6 0v2"/><path d="M9 13h6"/></svg></button>
      </div>
      <div id="side-stack">
        <button id="btn-recenter" aria-label="Recenter on player" title="Recenter on player"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="4" width="6" height="6"/><rect x="14" y="4" width="6" height="6"/><rect x="4" y="14" width="6" height="6"/><rect x="14" y="14" width="6" height="6"/></svg></button>
        <button id="btn-log" aria-label="Log" title="Log"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 6h14M5 12h14M5 18h10"/><circle cx="19" cy="18" r="1.2"/></svg></button>
      </div>
    </div>
  </div>
</div>
<div id="modal" class="hidden">
  <div id="modal-box">
    <h2 id="modal-title"></h2>
    <div id="modal-body"></div>
    <div id="modal-btns"></div>
  </div>
</div>
<script src="core.js"></script>
<script src="game.js"></script>
</body>
</html>
